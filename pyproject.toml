[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quovadis-repro"
version = "2.0.0"
description = "Self-contained code for the QUO VADIS image-attribution experiments in the PhD thesis"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "opencv-python-headless>=4.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
tensorflow = [
  "tensorflow>=2.13",
  "xplique>=1.4",
  "shap>=0.44",
  "lime>=0.2.0.1",
  "scikit-image>=0.21",
]
torch = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "captum>=0.7",
  "grad-cam>=1.5",
  "shap>=0.44",
  "lime>=0.2.0.1",
  "datasets>=2.16",
  "huggingface_hub>=0.29",
  "Pillow>=10",
  "scikit-image>=0.21",
  "detectors",
]
shap-bpt = [
  "shap-bpt==1.0.1",
]
dev = [
  "pytest>=7",
]
all = [
  "shap-bpt==1.0.1",
  "tensorflow>=2.13",
  "xplique>=1.4",
  "shap>=0.44",
  "lime>=0.2.0.1",
  "scikit-image>=0.21",
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "captum>=0.7",
  "grad-cam>=1.5",
  "datasets>=2.16",
  "huggingface_hub>=0.29",
  "Pillow>=10",
  "detectors",
]

[project.scripts]
quovadis-generate = "quovadis_repro.generate:main"
quovadis-evaluate = "quovadis_repro.evaluate:main"
quovadis-aggregate = "quovadis_repro.aggregate_saved:main"

[tool.setuptools.packages.find]
where = ["src"]
